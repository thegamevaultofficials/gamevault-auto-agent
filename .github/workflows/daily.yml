name: GameVault Daily Auto
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Agent
        run: python main.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-final
          path: |
            final_video.mp4
            gamevault_final.mp3
