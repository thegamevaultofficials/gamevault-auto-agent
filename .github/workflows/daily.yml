name: GameVault Daily Auto
on:
  schedule:
    - cron: '30 5 * * *'  # 11 AM IST Daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run GameVault Factory
        run: python main.py
      - name: Save Audio
        uses: actions/upload-artifact@v4
        with:
          name: gamevault-audio
          path: "**/*.mp3"
